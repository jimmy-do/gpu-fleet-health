# Metrics dcgm-exporter collects. Referenced by dcgmExporter.config.name in values.yaml.
# Format: DCGM field, Prometheus type, help text.
# ECC fields are listed so the alert works on data center cards; on consumer
# GeForce cards they are typically N/A and simply never appear in Prometheus.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dcgm-exporter-metrics
  namespace: gpu-operator
data:
  dcgm-metrics.csv: |
    # Clocks / thermals / power
    DCGM_FI_DEV_SM_CLOCK,             gauge,   SM clock frequency (MHz).
    DCGM_FI_DEV_MEM_CLOCK,            gauge,   Memory clock frequency (MHz).
    DCGM_FI_DEV_GPU_TEMP,             gauge,   GPU temperature (C).
    DCGM_FI_DEV_MEMORY_TEMP,          gauge,   Memory temperature (C).
    DCGM_FI_DEV_POWER_USAGE,          gauge,   Power draw (W).
    DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy since boot (mJ).
    # Utilization
    DCGM_FI_DEV_GPU_UTIL,             gauge,   GPU utilization (%).
    DCGM_FI_DEV_MEM_COPY_UTIL,        gauge,   Memory utilization (%).
    # Framebuffer
    DCGM_FI_DEV_FB_FREE,              gauge,   Framebuffer memory free (MiB).
    DCGM_FI_DEV_FB_USED,              gauge,   Framebuffer memory used (MiB).
    # Errors
    DCGM_FI_DEV_XID_ERRORS,           gauge,   Value of the last XID error encountered.
    DCGM_FI_DEV_ECC_SBE_VOL_TOTAL,    counter, Single-bit volatile ECC errors.
    DCGM_FI_DEV_ECC_DBE_VOL_TOTAL,    counter, Double-bit (uncorrectable) volatile ECC errors.
    DCGM_FI_DEV_PCIE_REPLAY_COUNTER,  counter, PCIe replay count.
