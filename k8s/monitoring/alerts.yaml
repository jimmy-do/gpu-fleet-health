# GPU health alerts. Each alert has a runbook section in README.md.
# Metrics come from dcgm-exporter via k8s/monitoring/dcgm-servicemonitor.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu-health
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: gpu-health
      rules:
        # Sustained temperature above 83C. The RTX 4090 starts slowing clocks
        # in the high 80s, so this fires before throttling hurts throughput.
        - alert: GPUTemperatureHigh
          expr: max by (node, gpu, UUID) (DCGM_FI_DEV_GPU_TEMP) > 83
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GPU {{ $labels.gpu }} on {{ $labels.node }} at {{ $value }}C (> 83C for 5m)"
            runbook_url: "https://github.com/jimmy-do/gpu-fleet-health#gputemperaturehigh"

        # DCGM_FI_DEV_XID_ERRORS holds the value of the *last* XID seen
        # (e.g. 79 = GPU fell off the bus). Any non-zero value means the driver
        # reported an error. It stays set until dcgm-exporter restarts.
        - alert: GPUXidErrorReported
          expr: max by (node, gpu, UUID) (DCGM_FI_DEV_XID_ERRORS) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "XID {{ $value }} reported by GPU {{ $labels.gpu }} on {{ $labels.node }}"
            runbook_url: "https://github.com/jimmy-do/gpu-fleet-health#gpuxiderrorreported"

        # Uncorrectable (double-bit) ECC errors. NOTE: consumer GeForce cards
        # do not report ECC, so the metric is absent and this rule never fires
        # on the RTX 4090. It is kept for parity with data center fleets.
        - alert: GPUUncorrectableECCErrors
          expr: increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL[10m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Uncorrectable ECC errors on GPU {{ $labels.gpu }} on {{ $labels.node }}"
            runbook_url: "https://github.com/jimmy-do/gpu-fleet-health#gpuuncorrectableeccerrors"

        # Guard rail: every rule above silently stays green if metrics stop
        # arriving. Fire when dcgm-exporter has produced nothing for 5m.
        - alert: GPUMetricsAbsent
          expr: absent(DCGM_FI_DEV_GPU_TEMP)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "No dcgm-exporter GPU metrics for 5m (exporter down, GPU missing, or scrape broken)"
            runbook_url: "https://github.com/jimmy-do/gpu-fleet-health#gpumetricsabsent"
